<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Edge</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M2 20h24' stroke='%235a6168' stroke-width='2'/><path d='M2 20 L13 6 L26 12.5' stroke='%2310b981' stroke-width='2.6'/><circle cx='13' cy='6' r='2.6' fill='%2310b981'/></g></svg>" />
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="side-brand">
      <div class="logo">
        <!-- The mark itself: the market's flat line, the long stroke
             climbing away from it, the short one falling off the peak, and
             the dot where they meet. It does not move and it does not tell
             the time -- this is the logo, and a logo that is different every
             minute is not one. The clock lives in the header. -->
        <svg class="brandmark" viewBox="0 0 28 28" aria-hidden="true">
          <path class="bm-flat" d="M2 20h24" />
          <path class="bm-rise" d="M2 20 L13 6 L26 12.5" />
          <circle class="bm-dot" cx="13" cy="6" r="2.6" />
        </svg>
        <span class="logo-text">The<span>Edge</span></span>
      </div>
      <div class="logo-sub">Model &amp; prediction tracker</div>
    </div>

    <nav class="side-nav" role="tablist">
      <button class="tab" role="tab" data-tab="home" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span></button>
      <button class="tab" role="tab" data-tab="teams" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.6"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5zM16 19c0-2 .6-3.4 1.6-4.2 2.4 0 4.4 1.5 4.4 4.2z"/></svg>
        <span>Teams</span></button>
      <button class="tab" role="tab" data-tab="picks" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        <span>Picks</span></button>
      <button class="tab" role="tab" data-tab="news" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a1 1 0 0 1 1 1v13a2 2 0 0 0 2 2H5a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1zm2 3v4h9V7zm0 6v2h9v-2zm0 4v2h6v-2z"/></svg>
        <span>News</span></button>
      <button class="tab" role="tab" data-tab="performance" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h3v-7H4zm6.5 0h3V4h-3zM17 20h3v-11h-3z"/></svg>
        <span>Performance</span></button>
      <button class="tab" role="tab" data-tab="assistant" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9c0 1.7.5 3.3 1.3 4.7L3 21l4.4-1.2A9 9 0 1 0 12 3zm-3.5 8.5h7v1.5h-7zm0-3h7V10h-7z"/></svg>
        <span>Assistant</span></button>
      <button class="tab" role="tab" data-tab="soon" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.6l4 2.3-1 1.7-5-2.9V7z"/></svg>
        <span>The Desk</span></button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6.2a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4z"/><path d="m19.4 13-.1-1 1.7-1.3-1.7-3-2 .7a7 7 0 0 0-1.7-1l-.3-2.1h-3.4l-.3 2.1a7 7 0 0 0-1.7 1l-2-.7-1.7 3L7.9 12l-.1 1-1.8 1.3 1.7 3 2-.7c.5.4 1.1.7 1.7 1l.3 2.1h3.4l.3-2.1c.6-.3 1.2-.6 1.7-1l2 .7 1.7-3z" opacity=".38"/></svg>
        <span>Settings</span></button>
    </nav>

    <div class="side-foot">
      <!-- Which feed last answered is a question you ask on Settings, when
           something is wrong. Every other page it was eight rows of green
           dots reporting that nothing had happened. What belongs in that space
           the rest of the time is the game. -->
      <div id="side-conns" hidden>
        <div class="side-label">Connections</div>
        <div id="statusbar"></div>
      </div>
      <div id="side-now"></div>
      <div class="side-updated">
        <span id="refreshed"></span>
      </div>
      <div class="build-line" id="build-line" title="Which build this is"></div>
    </div>
  </aside>

  <main class="main">
    <header class="hero">
      <!-- Four zones, left to right: what is live, what you are looking at,
           the time, and the controls. The time is in the middle because it is
           the one thing on this bar that is not about the app. -->
      <div class="hero-left">
        <!-- The odds button sits here, where the general refresh used to.
             Everything else in this app fetches itself on a minute and needs
             no button at all; the betting lines are a metered allowance and
             each press spends three of it, so the one control on this bar is
             the one that costs something. The general refresh moved to
             Settings, which is where you go when you want to make the app do
             something rather than watch it. -->
        <div class="eyebrow"><span class="pulse"></span><span id="cadence">Live</span>
          <button class="btn odds-btn" id="refresh-odds"
            title="Fetch the betting lines. Three requests from the monthly Odds API allowance.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
            <span>Update odds</span>
          </button>
        </div>
        <div class="odds-when-row"><span id="odds-when" class="tiny muted"></span></div>
        <div class="when-row">
          <h1 id="whenline">Week 1</h1>
        </div>
      </div>

      <div class="hero-center">
        <!-- The mark itself, keeping the time. No rim.

             The rim was there to say "this is a clock", and it was the one
             part of this drawing that is not in the logo -- so the header
             carried a circle the brand does not have, and the thing it was
             explaining (two hands, moving) explains itself. Without it the
             mark is the mark again: the flat line, the stroke climbing away
             from it, the short one falling off the peak, and the dot where
             they meet -- which is also, conveniently, the only point in the
             drawing a pair of hands could sensibly pivot on.

             So they pivot there. The silhouette is the logo's; the two green
             strokes on top of it are the hour and the minute.

             It sits outside the stack rather than in it: the greeting, the
             time and the date are one column centred on itself, and the mark
             stands to the left of that column instead of being one more thing
             the centring has to average. -->
        <div class="hero-time">
          <svg class="dialmark" viewBox="0 0 28 28" aria-hidden="true">
            <path class="bm-flat" d="M2 24h24" />
            <path class="bm-rise" d="M2 24 L14 12 L26 17" />
            <line class="bm-hand bm-hour" id="bm-hour"
                  x1="14" y1="12" x2="14" y2="5.4" transform="rotate(108.5 14 12)" />
            <line class="bm-hand bm-minute" id="bm-minute"
                  x1="14" y1="12" x2="14" y2="3.2" transform="rotate(222 14 12)" />
            <circle class="bm-dot" cx="14" cy="12" r="2.1" />
          </svg>
          <div class="hero-stack">
            <div class="hero-greet" id="greeting"></div>
            <div class="clock" id="clock"></div>
            <div class="clock-date" id="clockdate"></div>
          </div>
        </div>
      </div>

      <div class="hero-right">
        <select id="season" aria-label="Season"></select>
        <span id="week-wrap"><select id="week" aria-label="Week"></select></span>
        <div class="hero-buttons">
          <button class="icon-btn" id="fullscreen" title="Full screen (F11)" aria-label="Toggle full screen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></svg>
          </button>
          <!-- The mode you are in, not the one you would switch to: a moon
               while it is dark, a sun while it is light. Both are drawn and
               only one is shown; swapping an SVG's path on every toggle is how
               an icon ends up half-redrawn. -->
          <button class="icon-btn" id="theme" title="Toggle light and dark" aria-label="Toggle theme">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 14.2A8.5 8.5 0 0 1 9.8 3.3a8.5 8.5 0 1 0 10.9 10.9z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v3M12 19.2v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M1.8 12h3M19.2 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div id="view"><div class="panel"><div class="empty">Loading…</div></div></div>
  </main>

</div>

<dialog class="detail" id="detail">
  <div class="dialog-head">
    <h2 class="dialog-title" style="font-size:15px">Game</h2>
    <button class="btn" id="close-detail" style="margin-left:auto">Close</button>
  </div>
  <div class="dialog-body"></div>
</dialog>

<script type="module" src="/static/app.js"></script>
</body>
</html>
