<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NFL Picker</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🏈</text></svg>" />
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>🏈 NFL Picker</h1>
      <span class="sub" id="refreshed"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="games" aria-selected="true">Games</button>
      <button class="tab" role="tab" data-tab="teams" aria-selected="false">Teams</button>
      <button class="tab" role="tab" data-tab="picks" aria-selected="false">Picks</button>
      <button class="tab" role="tab" data-tab="news" aria-selected="false">News</button>
      <button class="tab" role="tab" data-tab="edge" aria-selected="false">Edge</button>
      <button class="tab" role="tab" data-tab="performance" aria-selected="false">Performance</button>
    </nav>
    <div class="controls">
      <span id="week-wrap"><select id="week" aria-label="Week"></select></span>
      <button class="btn" id="theme" title="Toggle light and dark">◐</button>
      <button class="btn primary" id="refresh">Refresh now</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="statusbar" id="statusbar"></div>
  <main id="view"><div class="panel"><div class="empty">Loading…</div></div></main>
</div>

<dialog class="detail" id="detail">
  <div class="dialog-head">
    <h2 class="dialog-title" style="font-size:15px">Game</h2>
    <button class="btn" id="close-detail" style="margin-left:auto">Close</button>
  </div>
  <div class="dialog-body"></div>
</dialog>

<script type="module" src="/static/app.js"></script>
</body>
</html>
