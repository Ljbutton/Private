<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Edge</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><g fill='none' stroke-linecap='round'><circle cx='14' cy='14' r='11.6' stroke='%235a6168' stroke-width='2.2'/><path d='M14 14 L19.1 10.4' stroke='%23e6ebf0' stroke-width='3'/><path d='M14 14 L6.1 9.5' stroke='%2310b981' stroke-width='2.6'/></g></svg>" />
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="side-brand">
      <div class="logo">
        <!-- A working clock. The rim is the market: the dial everything is
             measured against, and the one part that does not move. The long
             green hand is the edge. app.js turns both to the real time on
             every minute; the angles written here are 1:50, which is the pose
             the app icon is frozen at and what shows before the script runs.
             aria-hidden because the header states the time in words. -->
        <svg class="brandmark" viewBox="0 0 28 28" aria-hidden="true">
          <circle class="bm-rim" cx="14" cy="14" r="11.6" />
          <line class="bm-hand bm-hour" id="bm-hour"
                x1="14" y1="14" x2="14" y2="7.6" transform="rotate(55 14 14)" />
          <line class="bm-hand bm-minute" id="bm-minute"
                x1="14" y1="14" x2="14" y2="4.6" transform="rotate(300 14 14)" />
          <circle class="bm-pip" cx="14" cy="14" r="1.7" />
        </svg>
        <span class="logo-text">The<span>Edge</span></span>
      </div>
      <div class="logo-sub">Model &amp; market desk</div>
    </div>

    <nav class="side-nav" role="tablist">
      <button class="tab" role="tab" data-tab="home" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span></button>
      <button class="tab" role="tab" data-tab="teams" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.6"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5zM16 19c0-2 .6-3.4 1.6-4.2 2.4 0 4.4 1.5 4.4 4.2z"/></svg>
        <span>Teams</span></button>
      <button class="tab" role="tab" data-tab="picks" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        <span>Picks</span></button>
      <button class="tab" role="tab" data-tab="news" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a1 1 0 0 1 1 1v13a2 2 0 0 0 2 2H5a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1zm2 3v4h9V7zm0 6v2h9v-2zm0 4v2h6v-2z"/></svg>
        <span>News</span></button>
      <button class="tab" role="tab" data-tab="scoreboard" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v2h2v4a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 7.4 13H7a4 4 0 0 1-4-4V5h2zm0 4v2a2 2 0 0 0 2 2V7zm12 0v4a2 2 0 0 0 2-2V7z"/></svg>
        <span>Scoreboard</span></button>
      <button class="tab" role="tab" data-tab="performance" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h3v-7H4zm6.5 0h3V4h-3zM17 20h3v-11h-3z"/></svg>
        <span>Performance</span></button>
      <button class="tab" role="tab" data-tab="assistant" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9c0 1.7.5 3.3 1.3 4.7L3 21l4.4-1.2A9 9 0 1 0 12 3zm-3.5 8.5h7v1.5h-7zm0-3h7V10h-7z"/></svg>
        <span>Assistant</span></button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6.2a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4z"/><path d="m19.4 13-.1-1 1.7-1.3-1.7-3-2 .7a7 7 0 0 0-1.7-1l-.3-2.1h-3.4l-.3 2.1a7 7 0 0 0-1.7 1l-2-.7-1.7 3L7.9 12l-.1 1-1.8 1.3 1.7 3 2-.7c.5.4 1.1.7 1.7 1l.3 2.1h3.4l.3-2.1c.6-.3 1.2-.6 1.7-1l2 .7 1.7-3z" opacity=".38"/></svg>
        <span>Settings</span></button>
    </nav>

    <div class="side-foot">
      <div class="side-label">Connections</div>
      <div id="statusbar"></div>
      <div class="side-updated">
        <span id="refreshed"></span>
        <button class="icon-btn" id="refresh" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="hero">
      <div class="hero-left">
        <div class="eyebrow"><span class="pulse"></span><span id="cadence">Live</span></div>
        <h1 id="whenline">Week 1</h1>
      </div>
      <div class="hero-right">
        <div class="hero-greet" id="greeting"></div>
        <div class="clock" id="clock"></div>
        <div class="clock-date" id="clockdate"></div>
        <div class="hero-controls">
          <select id="season" aria-label="Season"></select>
          <span id="week-wrap"><select id="week" aria-label="Week"></select></span>
          <button class="icon-btn" id="fullscreen" title="Full screen (F11)" aria-label="Toggle full screen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></svg>
          </button>
          <button class="icon-btn" id="theme" title="Toggle light and dark" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18zm0 2.2V18.8a6.8 6.8 0 0 1 0-13.6z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div id="view"><div class="panel"><div class="empty">Loading…</div></div></div>
  </main>

</div>

<dialog class="detail" id="detail">
  <div class="dialog-head">
    <h2 class="dialog-title" style="font-size:15px">Game</h2>
    <button class="btn" id="close-detail" style="margin-left:auto">Close</button>
  </div>
  <div class="dialog-body"></div>
</dialog>

<script type="module" src="/static/app.js"></script>
</body>
</html>
