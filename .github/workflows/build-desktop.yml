# Builds the single-file desktop app.
#
# PyInstaller cannot cross-compile, so each target is built on its own runner.
# Run it from the Actions tab ("Run workflow"), then download the artifact --
# that is the whole point of this file: getting a Windows .exe without needing
# a Python toolchain on the machine that will run it.
name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "full (can train and read play-by-play) or lite (~40MB smaller, no pyarrow)"
        type: choice
        options: [full, lite]
        default: full
      targets:
        description: "Which platforms to build"
        type: choice
        options: [windows, macos, both]
        default: windows
  push:
    # Build when the packaging itself changes, on any branch. A manual run
    # is only offered for workflows that already exist on the default branch,
    # so without this there is no way to get a binary out of a feature branch.
    # Scoped to the files that decide what the binary contains, so ordinary
    # commits do not spend two runners each.
    branches: ["main", "claude/**"]
    paths:
      - "nflpicker.spec"
      - "scripts/desktop_entry.py"
      - "pyproject.toml"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Selected here rather than filtered with a job-level `if`, because the
        # matrix context is not available to one -- that combination is not a
        # failing build, it is a workflow that never starts and reports no jobs
        # at all. Inputs are null outside a manual run, so an automatic run
        # falls through to building both.
        target: >-
          ${{ fromJSON(
            inputs.targets == 'windows' && '["windows"]'
            || inputs.targets == 'macos' && '["macos"]'
            || '["windows","macos"]') }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-latest' || 'macos-latest' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pywebview pyinstaller

      # A build that ships a broken app is worse than no build, and the suite
      # is fully offline, so there is no reason not to run it first.
      - name: Test
        run: python -m pytest -q

      - name: Build
        run: pyinstaller nflpicker.spec --noconfirm -- --profile ${{ inputs.profile || 'full' }}

      # Confirms the frozen binary actually starts and serves, rather than
      # only that PyInstaller exited 0 -- the failure this catches is a missing
      # hidden import, which is invisible until first run.
      - name: Smoke test
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.target }}" = "windows" ]; then
            BIN="dist/NFLPicker.exe"
          else
            BIN="dist/NFLPicker"
          fi
          test -f "$BIN" || { echo "no binary at $BIN"; ls -R dist; exit 1; }
          NFLPICKER_DEMO=1 "$BIN" --selftest

      # A GitHub artifact is a zip, and that zip does not carry the executable
      # bit. On Windows that is harmless; on macOS it means the .app unzips
      # without +x and simply will not launch, which looks like a broken build
      # rather than a packaging detail. Tarring preserves the mode.
      - name: Package for macOS
        if: matrix.target == 'macos'
        run: |
          set -e
          test -d dist/NFLPicker.app || { echo "no .app bundle"; ls -R dist; exit 1; }
          tar -czf NFLPicker-macos.tar.gz -C dist NFLPicker.app
          shasum -a 256 NFLPicker-macos.tar.gz

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'windows'
        with:
          name: NFLPicker-windows-${{ inputs.profile || 'full' }}
          path: dist/NFLPicker.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'macos'
        with:
          name: NFLPicker-macos-${{ inputs.profile || 'full' }}
          path: NFLPicker-macos.tar.gz
          if-no-files-found: error
          retention-days: 30
