# Builds the desktop app.
#
# PyInstaller cannot cross-compile, so each target is built on its own runner.
# Run it from the Actions tab ("Run workflow"), then download the artifact --
# that is the whole point of this file: getting a binary without needing a
# Python toolchain on the machine that will run it.
name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "full (can train and read play-by-play) or lite (~40MB smaller, no pyarrow)"
        type: choice
        options: [full, lite]
        default: full
      targets:
        description: "Which platforms to build"
        type: choice
        options: [windows, macos, both]
        default: windows
  push:
    # A manual run is only offered for workflows that already exist on the
    # default branch, so without this there is no way to get a binary out of a
    # feature branch at all.
    #
    # The paths list used to name only the packaging files, on the reasoning
    # that they are what "decides what the binary contains". That was wrong in
    # the way that matters: the binary contains the application too. Eight
    # commits of real work -- a new default view, the trained model, scheduled
    # retraining -- produced no build, so the last downloadable executable was
    # silently weeks of features out of date while looking current.
    branches: ["main", "claude/**"]
    paths:
      - "nflpicker/**"
      - "data/models/**"
      - "nflpicker.spec"
      - "scripts/desktop_entry.py"
      - "pyproject.toml"
      - ".github/workflows/build-desktop.yml"

# Releases are how the builds are published (see the release job): creating
# one and uploading its assets needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Selected here rather than filtered with a job-level `if`, because the
        # matrix context is not available to one -- that combination is not a
        # failing build, it is a workflow that never starts and reports no jobs
        # at all. Inputs are null outside a manual run, so an automatic run
        # falls through to Windows; macOS is one dropdown away rather than two
        # more runners on every commit.
        #
        # "macos" means both architectures, deliberately. A Mac binary built
        # for the wrong one does not warn, it simply refuses to open, and
        # asking which Mac someone has is a worse answer than building both.
        target: >-
          ${{ fromJSON(
            inputs.targets == 'macos' && '["macos-arm","macos-intel"]'
            || inputs.targets == 'both' && '["windows","macos-arm","macos-intel"]'
            || '["windows"]') }}

    # macos-14 is Apple Silicon. For Intel it has to be macos-15-intel:
    # macos-13 was the last of the old Intel images and has been retired, and a
    # job asking for a retired label does not fail -- it queues forever with no
    # runner assigned, which looks like a slow build rather than an impossible
    # one.
    runs-on: >-
      ${{ matrix.target == 'windows' && 'windows-latest'
          || matrix.target == 'macos-arm' && 'macos-14'
          || 'macos-15-intel' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pywebview pyinstaller

      # pywebview's macOS backend talks to the system frameworks through
      # pyobjc, which it declares as a dependency but which nothing else in
      # this project would notice the absence of until the window failed to
      # open on someone's desk.
      - name: Check the macOS webview backend is installed
        if: startsWith(matrix.target, 'macos')
        run: |
          python - <<'PY'
          import webview.platforms.cocoa   # noqa: F401
          import AppKit, Foundation, WebKit, objc   # noqa: F401
          print("cocoa backend importable; pyobjc", objc.__version__)
          PY

      # A build that ships a broken app is worse than no build, and the suite
      # is fully offline, so there is no reason not to run it first.
      - name: Test
        run: python -m pytest -q

      # The formatting layer is the part a screenshot sweep cannot check: a
      # sweep proves a page renders, not that a missing probability renders as
      # a dash rather than "NaN%". node:test is built in, so this needs no
      # package.json and no install step.
      - name: Test the browser code
        shell: bash
        run: node --test tests/js/*.test.mjs

      - name: Build
        run: pyinstaller nflpicker.spec --noconfirm -- --profile ${{ inputs.profile || 'full' }}

      # An unsigned arm64 binary will not execute at all on Apple Silicon --
      # not "warns", not "asks", refuses. PyInstaller ad-hoc signs what it
      # writes, but assembling the bundle afterwards invalidates that, so the
      # .app is signed once more as a whole. Ad-hoc ("-") is not a developer
      # identity and does nothing for Gatekeeper; it is what makes the code
      # loadable.
      - name: Ad-hoc sign the bundle
        if: startsWith(matrix.target, 'macos')
        run: |
          set -e
          codesign --force --deep --sign - dist/TheEdge.app
          codesign --verify --deep --strict --verbose=2 dist/TheEdge.app

      # Confirms the frozen binary actually starts and serves, rather than
      # only that PyInstaller exited 0 -- the failure this catches is a missing
      # hidden import, which is invisible until first run. On macOS it runs the
      # binary *inside the bundle*, which is the one that ships; the loose copy
      # beside it can work while the bundled one does not.
      - name: Smoke test
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.target }}" = "windows" ]; then
            BIN="dist/TheEdge/TheEdge.exe"
          else
            BIN="dist/TheEdge.app/Contents/MacOS/TheEdge"
          fi
          test -f "$BIN" || { echo "no binary at $BIN"; ls -R dist | head -50; exit 1; }
          NFLPICKER_DEMO=1 "$BIN" --selftest

      # The smoke test above can never catch a missing-stdout bug, and one
      # shipped: a windowed build has sys.stdout set to None, uvicorn's default
      # log formatter picks its colours with sys.stdout.isatty(), and the app
      # died configuring logging before it ever opened a window. Capturing a
      # subprocess's output *gives it* a stdout -- so reading the selftest's
      # output, the only way to check it, was what made the failure disappear.
      #
      # This launches it the way a person does, with nothing listening, and
      # reads only the exit code. The app's own console.log carries the detail.
      - name: Smoke test with no stdout attached
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $env:NFLPICKER_DEMO = "1"
          $env:NFLPICKER_DATA_DIR = "$PWD\nostdout-data"
          $p = Start-Process -FilePath dist/TheEdge/TheEdge.exe `
                 -ArgumentList "--selftest" -Wait -PassThru
          $log = "$env:NFLPICKER_DATA_DIR\logs\console.log"
          if (Test-Path $log) { Write-Host "--- console.log"; Get-Content $log }
          if ($p.ExitCode -ne 0) {
            throw "selftest exited $($p.ExitCode) with no stdout attached"
          }
          Write-Host "ok: ran with no stdout attached"

      # A GitHub artifact is a zip, and that zip does not carry the executable
      # bit. On Windows that is harmless; on macOS it means the .app unzips
      # without +x and simply will not launch, which looks like a broken build
      # rather than a packaging detail. Tarring preserves the mode -- and the
      # code signature, which a zip round-trip through the artifact store can
      # also break.
      - name: Package for macOS
        if: startsWith(matrix.target, 'macos')
        run: |
          set -e
          test -d dist/TheEdge.app || { echo "no .app bundle"; ls -R dist | head -50; exit 1; }
          tar -czf TheEdge-${{ matrix.target }}.tar.gz -C dist TheEdge.app
          shasum -a 256 TheEdge-${{ matrix.target }}.tar.gz
          du -sh TheEdge-${{ matrix.target }}.tar.gz

      # Windows is a folder now, so it is zipped here rather than handed to
      # upload-artifact file by file. Zipping it ourselves also means the
      # release asset and the artifact are the same object: one download that
      # unpacks to one folder, instead of a zip of a zip.
      - name: Package for Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/TheEdge/TheEdge.exe)) {
            Get-ChildItem -Recurse dist | Select-Object -First 50
            throw "no dist/TheEdge/TheEdge.exe"
          }
          Compress-Archive -Path dist/TheEdge -DestinationPath TheEdge-windows.zip
          "{0:N0} MB" -f ((Get-Item TheEdge-windows.zip).Length / 1MB)

      # The smoke tests above run dist/TheEdge/TheEdge.exe, which is the build
      # and not the download. Everything between them -- the zip, and whatever
      # it does or does not preserve -- shipped untested, and a build whose
      # webview backend is intact in dist/ can still fall back to a browser
      # tab once it has been through an archive. So this unpacks the artifact
      # somewhere else entirely and runs *that*, which is the copy a person
      # ends up with.
      - name: Smoke test the zip we actually ship
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $out = "$PWD\shipped"
          Expand-Archive -Path TheEdge-windows.zip -DestinationPath $out -Force
          $exe = "$out\TheEdge\TheEdge.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse $out | Select-Object -First 40
            throw "the zip does not unpack to TheEdge\TheEdge.exe"
          }
          $env:NFLPICKER_DEMO = "1"
          $env:NFLPICKER_DATA_DIR = "$PWD\shipped-data"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          $log = "$env:NFLPICKER_DATA_DIR\logs\console.log"
          if (Test-Path $log) { Write-Host "--- console.log"; Get-Content $log }
          if ($p.ExitCode -ne 0) {
            throw "the shipped zip failed its selftest (exit $($p.ExitCode))"
          }
          # The selftest passes as long as the server answers; a browser
          # fallback is a pass by that measure and a failure by every other.
          # The whole point of shipping an app rather than a link is the window.
          if (-not (Select-String -Path $log -Pattern "usable=True" -Quiet)) {
            throw "the shipped build cannot open its own window — it would fall back to a browser"
          }
          Write-Host "ok: the shipped zip opens its own window"

      # The same zip, but tagged the way a browser tags a download.
      #
      # Windows writes a Zone.Identifier stream onto anything fetched from the
      # internet, and Explorer copies it onto every file it extracts. .NET
      # refuses to load an assembly carrying it, and pywebview's Windows
      # backend reaches WebView2 through pythonnet -- so the app cannot open
      # its own window and silently opens a browser instead. The one-file build
      # never hit this: it unpacks its own payload at runtime, and files a
      # process writes itself are not tagged. Moving to a folder exposed it.
      #
      # Reported rather than enforced on this run, because it is a hypothesis
      # until the log says otherwise, and a red build would hold up the release
      # that carries the fix.
      - name: Does a downloaded zip still work? (diagnostic)
        if: matrix.target == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = "marked.zip"
          Copy-Item TheEdge-windows.zip $zip
          # Zone 3 is "Internet", which is what a browser writes.
          Set-Content -Path $zip -Stream Zone.Identifier -Value @(
            "[ZoneTransfer]", "ZoneId=3")
          $out = "$PWD\marked"
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $dll = "$out\TheEdge\_internal\pythonnet\runtime\Python.Runtime.dll"
          if (Test-Path $dll) {
            $zone = Get-Content -Path $dll -Stream Zone.Identifier -ErrorAction SilentlyContinue
            Write-Host "Python.Runtime.dll zone marking: $(if ($zone) { 'BLOCKED' } else { 'clean' })"
          } else {
            Write-Host "no pythonnet runtime in the bundle at all"
            Get-ChildItem -Recurse "$out\TheEdge\_internal" -Filter "*.runtimeconfig.json" |
              ForEach-Object { Write-Host "  config: $($_.FullName)" }
          }
          $env:NFLPICKER_DEMO = "1"
          $env:NFLPICKER_DATA_DIR = "$PWD\marked-data"
          $p = Start-Process -FilePath "$out\TheEdge\TheEdge.exe" `
                 -ArgumentList "--selftest" -Wait -PassThru
          $log = "$env:NFLPICKER_DATA_DIR\logs\console.log"
          if (Test-Path $log) { Write-Host "--- console.log"; Get-Content $log }
          Write-Host "marked-zip selftest exit: $($p.ExitCode)"

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'windows'
        with:
          name: TheEdge-windows-${{ inputs.profile || 'full' }}
          path: TheEdge-windows.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.target, 'macos')
        with:
          name: TheEdge-${{ matrix.target }}-${{ inputs.profile || 'full' }}
          path: TheEdge-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Publishing the builds as a release, rather than leaving them as workflow
  # artifacts.
  #
  # An artifact is only downloadable through the Actions API, which is not a
  # CDN and does not behave like one: the same file that comes off a release at
  # link speed crawls out of the artifact store at around 100 KB/s, so a
  # hundred-megabyte build took the better part of half an hour to fetch.
  # Release assets are served from the CDN. The artifacts are still uploaded
  # above, because they are what the build's own page shows and they expire on
  # their own; the release is what a person actually downloads from.
  #
  # One rolling prerelease rather than a tag per build: the point is a link
  # that is always the newest build, and a version number on a branch that is
  # rebuilt several times a day would be noise. `prerelease` is honest about
  # what it is -- the head of a working branch, not a version anyone promised.
  release:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: downloaded
          merge-multiple: true

      - name: Show what will be published
        id: assets
        run: |
          ls -lh downloaded
          # Which platforms *this* run rebuilt. A push builds Windows only, so
          # without this the release body would date every asset to the newest
          # commit while the Mac ones still came from whenever a macOS build
          # was last asked for -- assets are replaced per file, not wiped.
          {
            echo "built<<EOF"
            for f in downloaded/*; do echo "- \`$(basename "$f")\`"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          # Moved to whatever was built last, so the tag keeps pointing at the
          # commit the assets actually came from rather than wherever it was
          # first created.
          target_commitish: ${{ github.sha }}
          prerelease: true
          # Each build replaces the previous assets under the same tag, so the
          # link in the README never goes stale and there is only ever one
          # "latest" to be confused by.
          files: downloaded/*
          body: |
            **Rebuilt in this run**, from `${{ github.ref_name }}` at commit
            ${{ github.sha }}:

            ${{ steps.assets.outputs.built }}

            Anything not listed there is still the file from the last run that
            built it — assets are replaced one at a time, not wiped. A push
            builds Windows only; the Mac builds are started by hand.

            | File | For |
            |---|---|
            | `TheEdge-windows.zip` | Windows. Unzip, unblock (below), then run `TheEdge.exe` **inside** the folder. |
            | `TheEdge-macos-arm.tar.gz` | Macs with Apple silicon (M1 and later) |
            | `TheEdge-macos-intel.tar.gz` | Intel Macs |

            `uname -m` says which Mac you have: `arm64` or `x86_64`.

            **Windows: unblock the files after extracting.** Windows tags
            anything out of a downloaded zip as internet-sourced, and .NET
            will not load a tagged assembly — which stops the app opening its
            own window and drops it to a browser tab. In PowerShell:

            ```powershell
            Get-ChildItem -Recurse "$HOME\Downloads\TheEdge-windows" | Unblock-File
            ```

            It will also warn on first run because the build is unsigned —
            *More info* → *Run anyway*. On macOS, extract from Terminal rather
            than Finder and see the README for the Gatekeeper step.

            This tag moves with every build, so the links above are always the
            newest one.
